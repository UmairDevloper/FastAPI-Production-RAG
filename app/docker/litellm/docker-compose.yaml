
services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: litellm-proxy
    restart: unless-stopped

    ports:
      - "127.0.0.1:4000:4000"

    env_file:
      - .env

    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro

    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"